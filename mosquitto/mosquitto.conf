# Native MQTT for the bridge, Node-RED and the CLI tools.
listener 1883
protocol mqtt

# Websockets for the browser console. A browser cannot speak raw MQTT, so the
# web page connects here instead. Same broker, same topics - it is just
# another client alongside the bridge and Node-RED.
listener 9001
protocol websockets

# Unauthenticated, as before. Reachable only over the LAN and Tailscale, which
# is the same exposure the Telegram path already has. If that ever changes,
# both listeners need a password_file, not just this one.
allow_anonymous true
