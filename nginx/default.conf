server {
    listen 80;

    # The console: a static page talking to this Pi's own mosquitto over
    # websockets. Kept outside the shots root so the frame listing below stays
    # a plain autoindex.
    location /console/ {
        alias /console/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # Machine-readable listing of /shots, so the console can group frames into
    # sessions without a bridge round-trip or HTML scraping.
    location /list/ {
        alias /usr/share/nginx/html/;
        autoindex on;
        autoindex_format json;
    }

    # Frames and previews, browsable by a human.
    location / {
        root /usr/share/nginx/html;
        autoindex on;
        autoindex_localtime on;
    }
}
